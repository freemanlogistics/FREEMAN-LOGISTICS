<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"> <!-- Sets character encoding -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile responsiveness -->
<title>Freeman Logistics Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* RESET STYLES */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY STYLE */
body{
    font-family:'Poppins',sans-serif;
    background:#f4f7fb;
    color:#1b1b1b;
}

/* LOGIN OVERLAY (SECURITY SCREEN) */
#loginScreen{
    position:fixed; /* stays on top of everything */
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#071c35; /* dark admin background */
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999; /* ensures it's above everything */
}

/* LOGIN BOX */
.login-box{
    background:#fff;
    padding:40px;
    border-radius:12px;
    width:320px;
    text-align:center;
}

/* INPUT STYLE */
.login-box input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:1px solid #ddd;
    border-radius:8px;
}

/* LOGIN BUTTON */
.login-box button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#ffb400;
    border:none;
    cursor:pointer;
    font-weight:600;
}

/* HIDE DASHBOARD INITIALLY */
.dashboard{
    display:none; /* hidden until login succeeds */
}

/* DASHBOARD LAYOUT */
.dashboard{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    background:#071c35;
    padding:30px;
    color:#fff;
}

/* LOGO */
.logo{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:50px;
}

.logo i{
    color:#ffb400;
    font-size:28px;
}

/* MENU */
.menu{
    list-style:none;
}

.menu li{
    margin-bottom:18px;
}

.menu a{
    text-decoration:none;
    color:#d8d8d8;
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-radius:8px;
}

/* ACTIVE MENU */
.menu a:hover,
.menu .active{
    background:#ffb400;
    color:#071c35;
}

/* MAIN AREA */
.main{
    padding:40px;
}

/* TOP BAR */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

/* PROFILE */
.admin-profile{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    padding:10px 16px;
    border-radius:10px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    padding:14px;
    border-bottom:1px solid #eee;
}

th{
    background:#071c35;
    color:#fff;
}

/* STATUS */
.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
}

.in-transit{background:#fff3cd;}
.delivered{background:#d4edda;}
.pending{background:#f8d7da;}

</style>
</head>

<body>

<!-- ================= LOGIN SCREEN ================= -->
<div id="loginScreen">

    <!-- LOGIN BOX -->
    <div class="login-box">

        <h2>Admin Login</h2> <!-- Title -->

        <input type="password" id="adminPassword" placeholder="Enter Admin Password"> <!-- Password input -->

        <button onclick="login()">Login</button> <!-- Login button -->

        <p id="error" style="color:red;margin-top:10px;"></p> <!-- Error message -->

    </div>

</div>

<!-- ================= DASHBOARD ================= -->
<div class="dashboard" id="dashboard">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-truck-fast"></i>
            <h2>Freeman Admin</h2>
        </div>

        <ul class="menu">
            <li><a href="#" class="active"><i class="fa fa-chart-line"></i> Dashboard</a></li>
            <li><a href="#shipments"><i class="fa fa-box"></i> Shipments</a></li>
        </ul>

    </div>

    <!-- MAIN CONTENT -->
    <div class="main">

        <div class="topbar">
            <h1>Dashboard</h1>

            <div class="admin-profile">
                <img src="https://randomuser.me/api/portraits/men/32.jpg">
                <div>
                    <h4>Admin</h4>
                    <small>Freeman Logistics</small>
                </div>
            </div>
        </div>

        <!-- SHIPMENTS TABLE -->
        <h2>Shipments</h2>

        <table>
            <thead>
                <tr>
                    <th>Tracking</th>
                    <th>Sender</th>
                    <th>Destination</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="tableBody">
                <!-- Data loads here dynamically -->
            </tbody>

        </table>

    </div>

</div>

<!-- ================= JAVASCRIPT ================= -->
<script>

/* ================= ADMIN PASSWORD ================= */
// ⚠️ change this later for real security
const ADMIN_PASSWORD = "Freemanlog123";

/* ================= LOGIN FUNCTION ================= */
function login(){

    // get password input value
    const input = document.getElementById("adminPassword").value;

    // check password
    if(input === ADMIN_PASSWORD){

        // save login session
        sessionStorage.setItem("loggedIn", "true");

        // show dashboard
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "grid";

        // load data
        loadShipments();

    } else {
        // show error
        document.getElementById("error").innerText = "Wrong password";
    }
}

/* ================= AUTO CHECK LOGIN ================= */
window.onload = function(){

    // check session
    if(sessionStorage.getItem("loggedIn") === "true"){

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "grid";

        loadShipments();
    }
}

/* ================= LOAD SHIPMENTS ================= */
async function loadShipments(){

    const res = await fetch("/.netlify/functions/track-all"); 
    // NOTE: you will later create this function

    const data = await res.json();

    const table = document.getElementById("tableBody");

    table.innerHTML = "";

    data.forEach(item => {

        table.innerHTML += `
        <tr>
            <td>${item.tracking_number}</td>
            <td>${item.sender_name}</td>
            <td>${item.destination}</td>
            <td><span class="status ${item.status.toLowerCase().replace(" ","-")}">${item.status}</span></td>
        </tr>
        `;
    });
}

</script>

</body>
</html>
